@for (event of events; track event.title) {
  <div class="event-row">
    <div class="event-head">
      <span class="title">{{ event.title }}</span>
      <span class="when">{{ event.date }}</span>
    </div>
    <span class="label">{{ meta(event) }}</span>
    <p class="ink-soft">{{ event.description }}</p>
  </div>
}
